# Native Pandora / SemanticPOSS semantic provider (CENet checkpoint, CPU torch).
#
# Wired into PerceptionPipeline.from_config as `mode: cenet`: checkpoint
# resolution is `VEYRA_CENET_CHECKPOINT` env (when set, wins) else this
# `checkpoint` (`model_path` also accepted as an alias); torch is imported
# lazily by the provider constructor. When weights/torch are absent the
# factory raises (fail closed) unless allow_fallback_to_ground_truth: true
# is explicitly configured — opt-in fallback keeps explicit provenance
# (status.semantic plus a diagnostics entry). Neural output is never
# relabelled: status reads "model" only when CENet actually runs.
#
# The provider declares supported_datasets == {"semanticposs"}, so the
# existing dataset gate accepts POSS frames and refuses anything else.
# Weights live under data/cache (git-ignored, never committed); when
# checkpoint_sha256 is set the factory verifies it before loading.
semantic:
  mode: cenet
  checkpoint: data/cache/models/cenet-poss/SENet_valid_best
  checkpoint_sha256: 9c07ceadcd005a11bddc6c92b61d6f7724339f9519ef177afdebc3c59ffbb0ce
  threads: 4
  # Fail closed: never fall back to ground_truth unless explicitly allowed.
  # Opt-in fallback requires allow_fallback_to_ground_truth: true.
  allow_fallback_to_ground_truth: false
ground:
  enabled: true
  parameter_overrides:
    min_range: 0.0
    max_range: 100.0
terrain:
  enabled: true
temporal:
  enabled: false
required_stages: [semantic, ground, terrain]
# Same conservative floors as the SalsaNext config: a completed process is
# not a valid semantic-perception result by itself. The CENet provider path
# clears all three on the closure frames (see reports/closure/semantic-
# finetune/RESULT.md); the SalsaNext path does not.
quality_gate:
  min_model_fov_mean_iou: 0.30
  min_model_fov_coverage_fraction: 0.90
  min_ground_f1: 0.75
