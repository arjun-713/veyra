# Veyra dependency updates — 3-person team, weekly, grouped to cut PR noise.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    groups:
      python:
        patterns: ["*"]
    labels: ["dependencies", "perception"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels: ["dependencies", "dx"]
    commit-message:
      prefix: "chore(deps)"
