name: Bug report
description: Something is broken — include repro + logs
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: perception / mapping / adaptive / terrain-temporal / ci / docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Commands, preset, dataset slice, SHA. Must be reproducible from a clean checkout.
      placeholder: |
        1. cmake --preset dev && cmake --build --preset dev
        2. ctest --preset dev --output-on-failure
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware / OS
      placeholder: "e.g. Ubuntu 22.04, gcc 11, RTX 3060"
