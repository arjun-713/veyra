name: Real-data perception regression

on:
  pull_request:
    paths:
      - "benchmarks/regression.py"
      - "benchmarks/test_regression.py"
      - "configs/perception-salsanext.yaml"
      - "configs/salsanext-model.json"
      - "scripts/fetch_semantic_model.py"
      - "perception/**"
      - "datasets/common/observation.py"
      - "datasets/common/taxonomy.py"
      - "viewer/**"
      - "tests/test_viewer_adapter_integration.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      dataset_archive_url:
        description: "License-cleared tar/zip containing a generic manifest slice"
        required: false
        type: string
      dataset_archive_sha256:
        description: "SHA-256 for the supplied slice archive"
        required: false
        type: string
      dataset_manifest:
        description: "Manifest path relative to the extracted slice root"
        required: false
        default: manifest.json
        type: string
      dataset_sequence:
        description: "Manifest sequence to replay"
        required: false
        default: "00"
        type: string
      license_confirmed:
        description: "Confirm redistribution/use in this CI run is permitted"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

jobs:
  perception-smoke:
    name: One real scan through SalsaNext + Patchwork++
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned perception dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Fetch pinned SalsaNext model
        run: python -m scripts.fetch_semantic_model
      - name: Download and verify Qualcomm scan
        run: |
          mkdir -p .cache/veyra-perception
          curl --fail --location --retry 3 --max-filesize 8388608 \
            https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/salsanext/v3/000000.bin \
            --output .cache/veyra-perception/000000.bin
          printf '%s  %s\n' \
            bf272996d5b6d25cc5589e1089137cb20a98b63bd4823a7fea5631b359f6d68c \
            .cache/veyra-perception/000000.bin | sha256sum --check
      - name: Run perception-only real-data regression
        run: |
          mkdir -p artifacts
          python -m benchmarks.regression \
            --repo "$GITHUB_WORKSPACE" \
            --scan "$GITHUB_WORKSPACE/.cache/veyra-perception/000000.bin" \
            --intensity-scale 1 \
            --output artifacts/perception-regression.json
      - name: Upload perception report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-perception-regression
          path: artifacts/perception-regression.json

  # Native dataset slices are deliberately opt-in. RELLIS-3D and SemanticPOSS
  # licensing/redistribution terms must be confirmed by the operator who owns
  # the archive; no dataset is committed to this repository or downloaded by
  # ordinary pull-request CI.
  native-slice:
    name: License-cleared native perception slice
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.license_confirmed == true &&
      inputs.dataset_archive_url != '' &&
      inputs.dataset_archive_sha256 != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned perception dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Download and verify operator-supplied slice
        env:
          ARCHIVE_URL: ${{ inputs.dataset_archive_url }}
          ARCHIVE_SHA256: ${{ inputs.dataset_archive_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .cache/veyra-native-slice/root artifacts
          curl --fail --location --retry 3 --max-filesize 524288000 \
            "$ARCHIVE_URL" --output .cache/veyra-native-slice/archive
          printf '%s  %s\n' "$ARCHIVE_SHA256" .cache/veyra-native-slice/archive | sha256sum --check
          case "$ARCHIVE_URL" in
            *.zip|*.zip\?*) unzip -q .cache/veyra-native-slice/archive -d .cache/veyra-native-slice/root ;;
            *) tar --extract --file .cache/veyra-native-slice/archive --directory .cache/veyra-native-slice/root ;;
          esac
      - name: Run real native slice through perception
        env:
          MANIFEST: ${{ inputs.dataset_manifest }}
          SEQUENCE: ${{ inputs.dataset_sequence }}
        run: |
          python -m scripts.validate_perception \
            --dataset generic \
            --root .cache/veyra-native-slice/root \
            --manifest "$MANIFEST" \
            --sequence "$SEQUENCE" \
            --count 10 \
            --config configs/perception.yaml \
            --output artifacts/native-slice-perception.json
      - name: Upload native slice report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-native-slice-perception
          path: artifacts/native-slice-perception.json
