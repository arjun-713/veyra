name: Triage (auto-label)

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-pr-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml

  label-issue-first-pass:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = (context.payload.issue.title || '').toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = `${title}\n${body}`;
            const labels = new Set(['needs-triage']);
            if (/percept|semantic|patchwork|salsa|frnet|dataset|kitti|rellis/.test(text)) labels.add('perception');
            if (/map|grid|cell|tile|quadtree|distancelod|split|merge|alignment|ownership/.test(text)) labels.add('mapping');
            if (/utilitylod|governor|benchmark|metric|latency|memory|foveat/.test(text)) labels.add('adaptive');
            if (/terrain|traversab|motion|static|moving|temporal/.test(text)) labels.add('terrain-temporal');
            if (/\.md|docs|readme|agents/.test(text)) labels.add('docs');
            if (/ci|workflow|dependabot|pre-commit|clang|devcontainer/.test(text)) labels.add('ci');
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: [...labels],
            });
