name: Veyra Tauri release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.0)
        required: true
        type: string
  push:
    tags: ["tauri-v*"]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # CI-hardening: bound hosted-runner spend (mirrors release.yml).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Linux x64, os: ubuntu-24.04, platform: linux, arch: x64, mapper: build/apps/runtime/veyra_runtime, bundles: "deb,rpm,appimage"}
          - {label: Windows x64, os: windows-2025, platform: win32, arch: x64, mapper: build/apps/runtime/Release/veyra_runtime.exe, bundles: nsis}
          - {label: macOS ARM64, os: macos-15, platform: darwin, arch: arm64, mapper: build/apps/runtime/veyra_runtime, bundles: dmg}
          # macOS x64 kept in parity with release.yml (Electron) until an
          # explicit drop-Intel decision is recorded; revisit if GitHub
          # retires the macos-15-intel runner.
          - {label: macOS x64, os: macos-15-intel, platform: darwin, arch: x64, mapper: build/apps/runtime/veyra_runtime, bundles: dmg}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Build the C++ mapper
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVEYRA_BUILD_APPS=ON
          cmake --build build --config Release --parallel 2
      - name: Stage relocatable backend into Tauri resources
        shell: bash
        run: |
          python -m venv --copies "$RUNNER_TEMP/veyra-python"
          if [ "${{ matrix.platform }}" = "win32" ]; then py="$RUNNER_TEMP/veyra-python/Scripts/python.exe"; else py="$RUNNER_TEMP/veyra-python/bin/python3"; fi
          "$py" -m pip install --disable-pip-version-check -r requirements.txt
          python scripts/stage_tauri_backend.py --repo . --mapper "${{ matrix.mapper }}" --python-runtime "$RUNNER_TEMP/veyra-python" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      # CI-hardening: stamp the bundle version from the release tag BEFORE
      # building. Tauri takes the bundle version from
      # src-tauri/tauri.conf.json (kept in sync with src-tauri/Cargo.toml);
      # RELEASE_VERSION was previously passed but never consumed, so every
      # bundle shipped 0.1.0 regardless of tag. apps/desktop/package.json is
      # intentionally NOT stamped here — it is the Electron track's input
      # (`npm version` in release.yml) and no Tauri input reads it.
      # No signing here by design (gated: needs secrets + Tauri updater
      # key decisions, survey §5.2) — bundles ship unsigned until then.
      - name: Stamp bundle version from release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          raw = os.environ["RELEASE_VERSION"].strip()
          match = re.fullmatch(r"(?:tauri-)?v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)", raw)
          if not match:
              raise SystemExit(
                  f"cannot derive bundle version from RELEASE_VERSION={raw!r} "
                  "(expected like 0.2.0, v0.2.0, or tauri-v0.2.0)"
              )
          version = match.group(1)

          conf_path = Path("src-tauri/tauri.conf.json")
          conf = json.loads(conf_path.read_text(encoding="utf-8"))
          conf["version"] = version
          conf_path.write_text(json.dumps(conf, indent=2) + "\n", encoding="utf-8")

          # Only the [package] version sits at column 0; dependency
          # `version = ...` entries are indented inside inline tables.
          cargo_path = Path("src-tauri/Cargo.toml")
          text = cargo_path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'^version\s*=\s*"[^"]*"',
              f'version = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("expected exactly one column-0 version field in src-tauri/Cargo.toml")
          cargo_path.write_text(updated, encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VEYRA_BUNDLE_VERSION={version}\n")
          print(f"stamped bundle version {version}")
          PY
      - name: Build Tauri package
        working-directory: apps/desktop
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: npm run tauri:build -- --bundles "${{ matrix.bundles }}"
      # Canonical provenance order: manifest FIRST, then checksums (mirrors
      # release.yml's publish regen). SHA256SUMS is the covering artifact —
      # it lists release-manifest.json — so the manifest itself does not
      # list SHA256SUMS. Do not swap these two commands.
      - name: Write release manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python scripts/release_manifest.py src-tauri/target/release/bundle \
            --output src-tauri/target/release/bundle/release-manifest.json \
            --version "${VEYRA_BUNDLE_VERSION:-$RELEASE_VERSION}" \
            --target "${{ matrix.platform }}-${{ matrix.arch }}"
          python scripts/release_checksums.py src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-tauri-${{ matrix.platform }}-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          # CI-hardening: release bundles await the future publish job
          # (survey §5.1); 30d keeps tagged releases verifiable meanwhile.
          retention-days: 30
