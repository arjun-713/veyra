name: Veyra Tauri release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.0)
        required: true
        type: string
  push:
    tags: ["tauri-v*"]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Linux x64, os: ubuntu-24.04, platform: linux, arch: x64, mapper: build/apps/runtime/veyra_runtime, bundles: deb,rpm,appimage}
          - {label: Windows x64, os: windows-2025, platform: win32, arch: x64, mapper: build/apps/runtime/Release/veyra_runtime.exe, bundles: nsis}
          - {label: macOS ARM64, os: macos-15, platform: darwin, arch: arm64, mapper: build/apps/runtime/veyra_runtime, bundles: dmg}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Build the C++ mapper
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVEYRA_BUILD_APPS=ON
          cmake --build build --config Release --parallel 2
      - name: Stage relocatable backend into Tauri resources
        shell: bash
        run: |
          python -m venv --copies "$RUNNER_TEMP/veyra-python"
          if [ "${{ matrix.platform }}" = "win32" ]; then py="$RUNNER_TEMP/veyra-python/Scripts/python.exe"; else py="$RUNNER_TEMP/veyra-python/bin/python3"; fi
          "$py" -m pip install --disable-pip-version-check -r requirements.txt
          python scripts/stage_tauri_backend.py --repo . --mapper "${{ matrix.mapper }}" --python-runtime "$RUNNER_TEMP/veyra-python" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build Tauri package
        working-directory: apps/desktop
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: npm run tauri:build -- --bundles "${{ matrix.bundles }}"
      - name: Write release manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python scripts/release_manifest.py src-tauri/target/release/bundle \
            --output src-tauri/target/release/bundle/release-manifest.json \
            --version "$RELEASE_VERSION" \
            --target "${{ matrix.platform }}-${{ matrix.arch }}"
          python scripts/release_checksums.py src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-tauri-${{ matrix.platform }}-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
