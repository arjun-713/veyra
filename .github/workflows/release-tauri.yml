name: Veyra Tauri release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit version (empty uses the automatic main version)
        required: false
        type: string
      prerelease:
        description: Publish to the prerelease channel
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# Finish a running release rather than cancelling builds on the next push.
# GitHub keeps one pending run per group; rapid pushes may supersede pending runs.
concurrency:
  group: veyra-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Release helper regression tests
        run: python -m unittest discover -s tests/scripts -p 'test*.py' -v
      - id: identity
        name: Resolve release version and channel
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        run: python scripts/prepare_tauri_release.py

  package:
    needs: prepare
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # CI-hardening: bound hosted-runner spend (mirrors release.yml).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Linux x64, os: ubuntu-24.04, platform: linux, arch: x64, python-version: "3.13", mapper: build/apps/runtime/veyra_runtime, bundles: "deb,rpm,appimage"}
          - {label: Windows x64, os: windows-2025, platform: win32, arch: x64, python-version: "3.12", mapper: build/apps/runtime/Release/veyra_runtime.exe, bundles: nsis}
          - {label: macOS ARM64, os: macos-15, platform: darwin, arch: arm64, python-version: "3.13", mapper: build/apps/runtime/veyra_runtime, bundles: dmg}
          # macOS x64 kept in parity with release.yml (Electron) until an
          # explicit drop-Intel decision is recorded; revisit if GitHub
          # retires the macos-15-intel runner.
          - {label: macOS x64, os: macos-15-intel, platform: darwin, arch: x64, python-version: "3.13", mapper: build/apps/runtime/veyra_runtime, bundles: dmg}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp product and backend version before staging
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/prepare_tauri_release.py --stamp "$RELEASE_VERSION"
        shell: bash
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Build the C++ mapper
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVEYRA_BUILD_APPS=ON
          cmake --build build --config Release --parallel 2
      - name: Stage relocatable backend into Tauri resources
        shell: bash
        run: |
          python -m venv --copies "$RUNNER_TEMP/veyra-python"
          if [ "${{ matrix.platform }}" = "win32" ]; then py="$RUNNER_TEMP/veyra-python/Scripts/python.exe"; else py="$RUNNER_TEMP/veyra-python/bin/python3"; fi
          "$py" -m pip install --disable-pip-version-check -r requirements.txt
          if [ "${{ matrix.platform }}" = "win32" ]; then bench="build/apps/benchmark/Release/veyra_benchmark.exe"; else bench="build/apps/benchmark/veyra_benchmark"; fi
          python scripts/stage_tauri_backend.py --repo . --mapper "${{ matrix.mapper }}" --benchmark "$bench" --python-runtime "$RUNNER_TEMP/veyra-python" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
      # Relocate and verify the exact staged files, import dependencies, start
      # the native mapper and require a successful framed runtime response.
      - name: Smoke-test staged backend
        shell: bash
        run: python scripts/smoke_tauri_backend.py src-tauri/resources/backend
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Check native CLI invocation
        run: node --test tools/tauri.test.mjs
      # Tauri CLI production build embeds the frontend; do not substitute cargo build.
      - name: Build Tauri package
        working-directory: apps/desktop
        shell: bash
        env:
          CI: "true"
        run: |
          args=()
          if [ "${{ matrix.platform }}-${{ matrix.arch }}" = "darwin-x64" ]; then
            args+=(--verbose)
          fi
          bundles="${{ matrix.bundles }}"
          # Build/sign the app normally, then create the DMG without the
          # mounted-image editing/detach path that stalls on Intel runners.
          if [ "${{ matrix.platform }}" = "darwin" ]; then bundles=app; fi
          npm run tauri:build -- --bundles "$bundles" "${args[@]}"
      - name: Create and verify macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          arch="${{ matrix.arch }}"
          if [ "$arch" = arm64 ]; then arch=aarch64; fi
          python scripts/package_macos_dmg.py \
            src-tauri/target/release/bundle/macos/Veyra.app \
            "src-tauri/target/release/bundle/dmg/Veyra_${RELEASE_VERSION}_${arch}.dmg"
      # CI-hardening: assert the expected installer artifacts exist BEFORE
      # writing provenance (survey §5.8). Cheap per-leg gate, no secrets:
      # maps each requested bundle target to its file suffix and fails the
      # leg when the bundler silently emits nothing (or the wrong set).
      # This checks build output, not end-user install-and-launch acceptance.
      - name: Assert bundle artifacts present
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          suffix = {
              "deb": ".deb",
              "rpm": ".rpm",
              "appimage": ".AppImage",
              "nsis": ".exe",
              "dmg": ".dmg",
          }
          requested = [b.strip() for b in os.environ["VEYRA_BUNDLES"].split(",")]
          unknown = [b for b in requested if b not in suffix]
          if unknown:
              raise SystemExit(f"unknown bundle target(s): {unknown}")
          root = Path("src-tauri/target/release/bundle")
          missing = [
              b
              for b in requested
              if not any(p.suffix == suffix[b] for p in root.rglob("*") if p.is_file())
          ]
          if missing:
              found = sorted(p.as_posix() for p in root.rglob("*") if p.is_file())
              raise SystemExit(f"missing bundle(s) {missing}; found: {found}")
          print(f"bundle artifacts present for: {requested}")
          PY
        env:
          VEYRA_BUNDLES: ${{ matrix.bundles }}
      - name: Stage only native installer assets
        shell: bash
        run: |
          python scripts/stage_tauri_release_assets.py \
            src-tauri/target/release/bundle \
            "$RUNNER_TEMP/veyra-release-assets" \
            --bundles "${{ matrix.bundles }}"
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-tauri-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/veyra-release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
          pattern: veyra-tauri-*
      - name: Build aggregate release manifest and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python scripts/build_tauri_release_manifest.py artifacts \
            --version "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/veyra-release-assets" --require-complete
          python scripts/release_checksums.py "$RUNNER_TEMP/veyra-release-assets"
      - name: Publish installer files to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          channel=stable
          if [ "$PRERELEASE" = true ]; then
            channel=prerelease
          fi
          printf 'Veyra native desktop installers.\n\nChannel: %s\nSource commit: %s\n\nIncludes the production UI, Python dependencies and native mapper. No development server or separate Python installation is required. Datasets and semantic model weights remain user-provided.\n\nVerify downloads with SHA256SUMS and release-manifest.json. Windows builds are unsigned; macOS builds are ad-hoc signed, not Developer ID signed/notarized. OS security warnings may apply.\n' "$channel" "$SOURCE_SHA" > release-notes.md
          mapfile -d '' assets < <(find "$RUNNER_TEMP/veyra-release-assets" -maxdepth 1 -type f -print0 | sort -z)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            target=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
            if [ "$draft" != true ] || [ "$target" != "$SOURCE_SHA" ]; then
              echo 'Refusing to overwrite a published release or a draft from another commit.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --title "Veyra $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"
          # Only expose downloads after every installer, checksum and manifest uploaded.
          latest=true
          if [ "$PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest" --notes-file release-notes.md
