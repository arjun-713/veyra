name: Veyra product

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Runtime and Electron product
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install runtime test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Configure strict backend
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DVEYRA_BUILD_APPS=ON -DCMAKE_CXX_FLAGS=-Werror
      - name: Build mapper runtime
        run: cmake --build build --parallel
      - name: Verify product runtime
        env:
          VEYRA_BENCHMARK_BINARY: ${{ github.workspace }}/build/apps/benchmark/veyra_benchmark
        run: |
          python -m unittest tests.test_engine_service -v
          python -m unittest tests.test_product_runtime -v
          python -m unittest tests.test_package_backend -v
          python -m unittest benchmarks.test_product_benchmark -v
          python -m unittest benchmarks.test_render_report -v
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify desktop units and types
        working-directory: apps/desktop
        run: |
          npm test
          npm run check
          npm run build
      - name: Package Linux shell
        working-directory: apps/desktop
        run: npm run package
      - name: Electron smoke test
        working-directory: apps/desktop
        env:
          VEYRA_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: xvfb-run -a npm run test:e2e
      - name: Upload packaged Linux smoke artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-linux-unpacked-${{ github.sha }}
          path: apps/desktop/out/
          retention-days: 7
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-product-failure
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
