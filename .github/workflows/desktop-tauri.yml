name: Tauri desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tauri ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # CI-hardening: bound hosted-runner spend. No retention-days here by
    # design — this job is compile-only (--no-bundle) and uploads no
    # artifacts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend checks
        working-directory: apps/desktop
        run: |
          npm run check
          npm run build
      - name: Rust formatting and tests
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build Tauri application without packaging
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: apps/desktop/node_modules/.bin/tauri build --config src-tauri/tauri.conf.json --no-bundle
