name: Team standup (issue-bot)

# Daily sync issue with rotation. Edit assignees to your 3 GitHub usernames.
# Docs: https://github.com/marketplace/actions/issue-bot-action
on:
  schedule:
    # 04:00 UTC = 09:30 IST, Mon–Fri
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  standup:
    runs-on: ubuntu-latest
    steps:
      - name: Create standup issue
        uses: imjohnbo/issue-bot@v3
        with:
          # Mallik (perception), Samay (mapping), Vinay (adaptive)
          assignees: "arjun-713, samay43, bmvinay7"
          labels: "standup, team-sync"
          title: "Daily standup"
          body: |-
            ## Daily sync — reply in a comment

            Hi {{#each assignees}}@{{this}}{{#unless @last}}, {{/unless}}{{/each}}! Drop a short update:

            - Yesterday:
            - Today:
            - Blockers:

            Labels: `standup`, `team-sync`. Previous issue: #{{previousIssueNumber}}.
          close-previous: true
          linked-comments: true
          rotate-assignees: true
