name: Veyra release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.2.0-rc.1)
        required: true
      prerelease:
        description: Publish to the prerelease channel
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: Linux x64, os: ubuntu-24.04, platform: linux, arch: x64, mapper: build/apps/runtime/veyra_runtime}
          - {label: Windows x64, os: windows-2025, platform: win32, arch: x64, mapper: build/apps/runtime/Release/veyra_runtime.exe}
          - {label: macOS ARM64, os: macos-15, platform: darwin, arch: arm64, mapper: build/apps/runtime/veyra_runtime}
          - {label: macOS x64, os: macos-15-intel, platform: darwin, arch: x64, mapper: build/apps/runtime/veyra_runtime}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build native runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVEYRA_BUILD_APPS=ON
          cmake --build build --config Release --parallel 2
      - name: Prepare relocatable runtime directory
        shell: bash
        run: |
          python -m venv --copies "$RUNNER_TEMP/veyra-python"
          if [ "${{ matrix.platform }}" = win32 ]; then py="$RUNNER_TEMP/veyra-python/Scripts/python.exe"; else py="$RUNNER_TEMP/veyra-python/bin/python3"; fi
          "$py" -m pip install --disable-pip-version-check -r requirements.txt
          python scripts/package_backend.py --repo . --output "$RUNNER_TEMP/backend" --mapper "${{ matrix.mapper }}" --python-runtime "$RUNNER_TEMP/veyra-python" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
          echo "VEYRA_BACKEND_BUNDLE=$RUNNER_TEMP/backend" >> "$GITHUB_ENV"
      - name: Smoke test staged runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = win32 ]; then py="$RUNNER_TEMP/backend/python/python.exe"; else py="$RUNNER_TEMP/backend/python/bin/python3"; fi
          printf '{"id":"release-smoke","command":"status","args":{}}\n' | "$py" -u -m runtime --repo "$RUNNER_TEMP/backend" > "$RUNNER_TEMP/runtime-smoke.bin"
          python -c "from pathlib import Path; data=Path(r'$RUNNER_TEMP/runtime-smoke.bin').read_bytes(); assert len(data)>16 and data[:4]==b'VYRA'"
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/veyra-signing.p12"
          keychain="$RUNNER_TEMP/veyra-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p temporary "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p temporary "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
      - name: Materialize Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          certificate="$RUNNER_TEMP/veyra-signing.pfx"
          echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          echo "WINDOWS_CERTIFICATE_FILE=$certificate" >> "$GITHUB_ENV"
      - name: Install and verify desktop
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npm version --no-git-tag-version "${RELEASE_VERSION#v}"
          npm test
          npm run check
      - name: Make platform packages
        working-directory: apps/desktop
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run make
      - name: Write release checksums
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          signed = os.environ['HAS_APPLE_CERTIFICATE'] == 'true' if os.environ['RELEASE_PLATFORM'] == 'darwin' else os.environ['HAS_WINDOWS_CERTIFICATE'] == 'true' if os.environ['RELEASE_PLATFORM'] == 'win32' else False
          Path('apps/desktop/out/make/release-metadata.json').write_text(json.dumps({'schema_version': 1, 'platform': os.environ['RELEASE_PLATFORM'], 'arch': os.environ['RELEASE_ARCH'], 'signed': signed}, indent=2) + '\n')
          PY
          python scripts/release_checksums.py apps/desktop/out/make
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/out/make/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
        run: |
          find artifacts -type f -name SHA256SUMS -delete
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root = Path('artifacts')
          files = sorted(path for path in root.rglob('*') if path.is_file())
          (root / 'SHA256SUMS').write_text(''.join(f'{sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}\n' for path in files))
          PY
          channel=stable
          flag=()
          if [ "$PRERELEASE" = true ]; then channel=prerelease; flag=(--prerelease); fi
          printf 'Cross-platform Veyra desktop packages. Channel: %s. Verify downloads with SHA256SUMS.\n' "$channel" > release-notes.md
          mapfile -d '' files < <(find artifacts -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${files[@]}"
            gh release edit "$RELEASE_TAG" --title "Veyra $RELEASE_TAG" --notes-file release-notes.md "${flag[@]}"
          else
            gh release create "$RELEASE_TAG" --title "Veyra $RELEASE_TAG" --notes-file release-notes.md "${flag[@]}" "${files[@]}"
          fi
