name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'apps/runtime/**'
      - 'apps/benchmark/**'
      - 'tests/**'
      - 'datasets/**'
      - 'perception/**'
      - 'scripts/**'
      - 'benchmarks/**'
      - 'viewer/**'
      - 'configs/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'apps/desktop/**'
      - 'src-tauri/**'
      - 'tools/tauri.mjs'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'apps/runtime/**'
      - 'apps/benchmark/**'
      - 'tests/**'
      - 'datasets/**'
      - 'perception/**'
      - 'scripts/**'
      - 'benchmarks/**'
      - 'viewer/**'
      - 'configs/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'apps/desktop/**'
      - 'src-tauri/**'
      - 'tools/tauri.mjs'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/${{ matrix.build_type }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON -DVEYRA_BUILD_APPS=ON
          -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build/${{ matrix.build_type }} --parallel
      - name: CTest
        run: ctest --test-dir build/${{ matrix.build_type }} --output-on-failure -E "python_unittest|benchmark_runtime"

  python:
    name: Python tests and static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: >-
          ruff check benchmarks perception datasets
          viewer/runtime.py viewer/server.py
          scripts/fetch_semantic_model.py scripts/validate_perception.py
          tests/test_perception_pipeline.py tests/test_salsanext.py tests/test_taxonomy.py
          --ignore SIM117,I001
      - name: Python formatting
        run: >-
          ruff format --check
          viewer/runtime.py viewer/server.py
          datasets/generic perception/semantic/salsanext.py
          scripts/validate_perception.py
          tests/test_generic_adapter.py tests/test_viewer_adapter_integration.py
          tests/test_viewer_runtime_http.py
      - name: JavaScript syntax
        run: node --check viewer/static/app.js
      - name: Python syntax
        run: python -m compileall -q benchmarks datasets perception scripts tests
      - name: Python tests
        run: |
          python -m unittest discover -s benchmarks -p 'test*.py' -v
          python -m unittest discover -s tests -p 'test*.py' -v

  formatting:
    name: C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned clang-format
        run: python -m pip install --disable-pip-version-check clang-format==23.1.0
      - name: Check owned C++ sources
        run: python -c "import shutil; assert shutil.which('clang-format'), 'clang-format is not on PATH'"
      - name: Check owned C++ sources
        run: clang-format --dry-run --Werror apps/benchmark/main.cpp
