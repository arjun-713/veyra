name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pin toolchain
        run: |
          g++ --version
          cmake --version
          ninja --version
      - name: Configure
        run: |
          if [ ! -f CMakeLists.txt ] && [ ! -f CMakePresets.json ]; then
            echo "No CMake project yet — skipping configure (docs-only repo)."
            exit 0
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          if [ ! -d build ]; then echo "No build dir — skipping."; exit 0; fi
          cmake --build build -j
      - name: Test
        run: |
          if [ ! -d build ]; then echo "No build dir — skipping."; exit 0; fi
          ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No C++ files — skipping."; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-14
          echo "$files" | xargs clang-format-14 --dry-run --Werror

  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements*.txt"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Ruff
        run: |
          if git ls-files '*.py' | grep -q .; then ruff check .; else echo "No Python files — skipping."; fi

  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Internal link check
        run: python3 scripts/check_docs_links.py
