name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'apps/runtime/**'
      - 'apps/benchmark/**'
      - 'tests/**'
      - 'datasets/**'
      - 'perception/**'
      - 'scripts/**'
      - 'benchmarks/**'
      - 'viewer/**'
      - 'configs/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'apps/desktop/**'
      - 'src-tauri/**'
      - 'tools/tauri.mjs'
      - 'tools/tauri.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'apps/runtime/**'
      - 'apps/benchmark/**'
      - 'tests/**'
      - 'datasets/**'
      - 'perception/**'
      - 'scripts/**'
      - 'benchmarks/**'
      - 'viewer/**'
      - 'configs/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'apps/desktop/**'
      - 'src-tauri/**'
      - 'tools/tauri.mjs'
      - 'tools/tauri.test.mjs'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      python: ${{ steps.filter.outputs.python }}
      desktop: ${{ steps.filter.outputs.desktop }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            cpp:
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'include/**'
              - 'src/**'
              - 'apps/runtime/**'
              - 'apps/benchmark/**'
              - 'tests/**'
            python:
              - 'datasets/**'
              - 'perception/**'
              - 'scripts/**'
              - 'benchmarks/**'
              - 'viewer/**'
              - 'configs/**'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - 'tests/**'
            desktop:
              - 'apps/desktop/**'
              - 'src-tauri/**'
              - 'tools/tauri.mjs'
              - 'tools/tauri.test.mjs'
            shared:
              - '.github/workflows/**'
              - 'protocol/**'
              - 'docs/ci-fast-actions.md'

  cpp:
    name: C++ Release core checks
    needs: changes
    if: needs.changes.outputs.cpp == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Release build
        run: >-
          cmake -S . -B build/Release
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DVEYRA_BUILD_APPS=ON
          -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror'
      - name: Build
        run: cmake --build build/Release --parallel
      - name: CTest
        run: >-
          ctest --test-dir build/Release --output-on-failure --parallel 2
          -E 'python_unittest|benchmark_runtime'
      - name: C++ formatting
        run: |
          python3 -m pip install --disable-pip-version-check clang-format==23.1.0
          clang-format --dry-run --Werror apps/benchmark/main.cpp

  python:
    name: Python tests and static checks
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: >-
          ruff check benchmarks perception datasets
          viewer/runtime.py viewer/server.py
          scripts/fetch_semantic_model.py scripts/validate_perception.py
          tests/test_perception_pipeline.py tests/test_salsanext.py tests/test_taxonomy.py
          --ignore E402,SIM117,I001
      - name: Python formatting
        run: >-
          ruff format --check
          viewer/runtime.py viewer/server.py
          datasets/generic perception/semantic/salsanext.py
          tests/test_generic_adapter.py tests/test_viewer_adapter_integration.py
          tests/test_viewer_runtime_http.py
      - name: JavaScript syntax
        run: node --check viewer/static/app.js
      - name: Python syntax
        run: python -m compileall -q benchmarks datasets perception scripts tests
      - name: Python tests
        run: |
          python -m unittest discover -s benchmarks -p 'test*.py' -v
          python -m unittest discover -s tests -p 'test*.py' -v
          python -m unittest discover -s tests/scripts -p 'test*.py' -v

  desktop:
    name: Desktop frontend and Rust checks
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend checks
        working-directory: apps/desktop
        run: |
          npm test
          npm run check
          npm run build
      - name: Tauri CLI invocation regression
        run: node --test tools/tauri.test.mjs
      - name: Prepare resource path for Rust checks
        run: mkdir -p src-tauri/resources/backend
      - name: Install runtime dependencies for supervisor tests
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 pyyaml==6.0.2
      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
