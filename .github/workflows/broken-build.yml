name: Broken build → issue (issue-bot)

# Auto-files a labeled bug when CI fails on main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  file-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: File CI failure issue
        uses: imjohnbo/issue-bot@v3
        with:
          labels: "bug, ci, auto-triage"
          title: "CI failed on main"
          body: |-
            CI failed — needs triage.

            - Run: ${{ github.event.workflow_run.html_url }}
            - SHA: ${{ github.event.workflow_run.head_sha }}
            - Branch: ${{ github.event.workflow_run.head_branch }}

            Steps:
            1. Repro locally via `.devcontainer` or `CMakePresets.json` dev preset.
            2. Paste failing log section in a comment.
            3. Convert to a `bug` with owner + fix PR, or close with reason.
